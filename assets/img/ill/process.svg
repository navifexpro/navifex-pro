ilter></defs><style>.pl{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 7s ease-in-out -3s infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.dr{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 3.2s cubic-bezier(.3,.7,.2,1) .4s forwards}@keyframes dr{to{stroke-dashoffset:0}}.dt{animation:dt 1.4s ease-in-out infinite}.dt:nth-child(2){animation-delay:.2s}.dt:nth-child(3){animation-delay:.4s}@keyframes dt{0%,60%,100%{opacity:.35}30%{opacity:1}}.st{animation:st 3s ease-in-out infinite}.st2{animation:st 3s ease-in-out -1.5s infinite}@keyframes st{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}.ph{animation:phd 6s linear infinite}@keyframes phd{0%{transform:translateX(0)}100%{transform:translateX(var(--pd,300px))}}.rg{transform-box:fill-box;transform-origin:center;animation:rg 3.6s ease-out infinite}.rg2{animation-delay:1.8s}@keyframes rg{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.dr{stroke-dashoffset:0}}</style><circle cx="500" cy="580" r="440" fill="url(#g)"/><circle cx="500" cy="580" r="343" fill="none" stroke="#5aa2ff" stroke-opacity=".13" stroke-width="1.5"/><circle cx="500" cy="580" r="431" fill="none" stroke="#5aa2ff" stroke-opacity=".07" stroke-width="1.5" stroke-dasharray="3 9"/><path d="M120 178V202M108 190H132" stroke="#5aa2ff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><path d="M900 190.4V209.6M890.4 200H909.6" stroke="#8fc1ff" stroke-width="2.0" stroke-linecap="round" opacity=".7"/><circle cx="110" cy="1000" r="6" fill="#f5b84b"/><path d="M260 1000C260 860 740 880 740 740S260 600 260 460 740 320 740 200" stroke="#1f3054" stroke-width="54" fill="none" stroke-linecap="round"/><path d="M260 1000C2