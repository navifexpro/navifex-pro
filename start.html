  var prev=null;var hello={side:"in",type:"text",text:HELLO,ts:S.ui.length?S.ui[0].ts:Date.now()};
  [hello].concat(S.ui).forEach(function(u){var el=bubble(u,!prev||prev.side!==u.side);u.el=el;M.appendChild(el);prev=u});
  if(!S.msgs.length){var c=document.createElement("div");c.className="chips";var list=SVC.slice();var pi=list.findIndex(function(x){return x[0]===pre});if(pi>0)list.unshift(list.splice(pi,1)[0]);
    list.forEach(function(x){var bt=document.createElement("button");bt.textContent=x[1];if(x[0]===pre)bt.className="hot";bt.onclick=function(){c.remove();sendText("Mujhe "+x[1]+" chahiye / I need "+x[1])};c.appendChild(bt)});M.appendChild(c)}
  scroll()}
function scroll(){requestAnimationFrame(function(){M.scrollTop=M.scrollHeight})}
function add(u){u.ts=u.ts||Date.now();var last=S.ui[S.ui.length-1]||{side:"in"};S.ui.push(u);var el=bubble(u,last.side!==u.side);u.el=el;var ch=M.querySelector(".chips");if(ch&&u.side==="out")ch.remove();M.insertBefore(el,M.querySelector(".typing"));save();scroll();return u}
function refresh(u){var n=bubble(u,u.el&&u.el.classList.contains("first"));u.el.replaceWith(n);u.el=n;save()}
function toast(t){var x=$("toast");x.textContent=t;x.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){x.style.display="none"},3500)}
function detect(t){if(/[؀-ۿ]/.test(t))S.lang="ur";else if(/\b(hai|hain|kya|mujhe|chahiye|aap|ap|nahi|nhi|haan|han|mera|meri|karna|krna|kaam|ke|ki|ka|ko|se|bhi)\b/i.test(t))S.lang="ur";else if(/\b(the|is|my|we|need|want|have|please|website|business)\b/i.test(t))S.lang="en"}
// ---- talking to the bot
var timer=null,busy=false,again=false,fresh=[];
function queue(){clearTimeout(timer);timer=setTimeout(callBot,1100)}
function typing(on){var t=M.querySelector(".typing");$("st").textContent=on?"typing…":"online";if(on&&!t){t=document.createElement("div");t.className="row in typing first";t.innerHTML='<div class="b"><span class="dots"><i></i><i></i><i></i></span></div>';M.appendChild(t);scroll()}if(!on&&t)t.remove()}
function callBot(){if(busy){again=true;return}busy=true;typing(true);
  var msgs=S.msgs.map(function(m,i){var f=fresh.filter(function(x){return x.i===i})[0];if(f)return {role:"user",content:[{type:"text",text:m.content},{type:"image",source:{type:"base64",media_type:"image/jpeg",data:f.data}}]};return {role:m.role,content:m.content}});
  var sentCount=S.msgs.length;fresh=[];
  setTimeout(function(){S.ui.forEach(function(u){if(u.side==="out"&&!u.dlv&&!u.seen){u.dlv=true;if(u.el)refresh(u)}})},350);
  fetch(API+"/api/intake-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid:S.sid,ref:ref,media:S.media||"",messages:msgs})})
  .then(function(r){return r.json().catch(function(){return {}})}).then(function(d){
    S.ui.forEach(function(u){if(u.side==="out"&&!u.seen){u.seen=true;if(u.el)refresh(u)}});
    var reply=d.reply||"Maazrat, connection ka masla aa gaya. Dobara bhejein ya WhatsApp karein: https://wa.me/923130111349";
    if(d.reply&&S.msgs.length>sentCount){return}
    typing(false);
    var parts=reply.split(/\n{2,}/).filter(Boolean);if(parts.length>3)parts=[reply];
    parts.forEach(function(p,k){setTimeout(function(){add({side:"in",type:"text",text:p})},k*450)});
    if(d.reply)S.msgs.splice(sentCount,0,{role:"assistant",content:reply});
    if(d.saved&&typeof gtag==="function"&&!S.tracked){S.tracked=1;gtag("event","generate_lead",{method:"chat"})}
    save();
  }).catch(function(){typing(false);add({side:"in",type:"text",text:"Internet ka masla lag raha hai. Dobara bhejein ya WhatsApp karein: https://wa.me/923130111349"})})
  .then(function(){busy=false;if(again||S.msgs.length&&S.msgs[S.msgs.length-1].role==="user"){again=false;queue()}})}
function pushUser(text,img){S.msgs.push({role:"user",content:text});if(img)fresh.push({i:S.msgs.length-1,data:img});save();queue()}
function sendText(t){t=String(t||"").trim();if(!t)return;detect(t);add({side:"out",type:"text",text:t});pushUser(t)}
// ---- composer
function sync(){var has=T.value.trim().length>0;$("icMic").classList.toggle("hide",has);$("icSend").classList.toggle("hide",!has);$("sendBtn").setAttribute("aria-label",has?"Send":"Record voice note");$("camBtn").classList.toggle("hide",has);T.style.height="auto";T.style.height=Math.min(T.scrollHeight,120)+"px"}
T.addEventListener("input",sync);
T.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();go()}});
function go(){if(rec){stopRec(true);return}if(T.value.trim()){sendText(T.value);T.value="";sync();T.focus()}else startRec()}
$("sendBtn").onclick=go;
$("attBtn").onclick=function(e){e.stopPropagation();$("att").classList.toggle("on")};
$("camBtn").onclick=function(){$("fCam").click()};
$("mBtn").onclick=function(e){e.stopPropagation();$("menu").classList.toggle("on")};
document.addEventListener("click",function(){$("att").classList.remove("on");$("menu").classList.remove("on")});
$("newChat").onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}S=load();fresh=[];render()};
$("att").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;$("att").classList.remove("on");
  if(a==="media")$("fMedia").click();else if(a==="camera")$("fCam").click();else if(a==="doc")$("fDoc").click();else if(a==="loc")sendLoc()});
["fMedia","fCam","fDoc"].forEach(function(id){$(id).onchange=function(){[].slice.call(this.files).forEach(sendFile);this.value=""}});
// ---- uploads
function b64(blob){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result).split(",")[1])};r.onerror=no;r.readAsDataURL(blob)})}
var upQ=[],upN=0;function upNext(){while(upN<2&&upQ.length)upQ.shift()()}
function slot(fn){return new Promise(function(ok,no){upQ.push(function(){upN++;fn().then(function(v){upN--;upNext();ok(v)},function(e){upN--;upNext();no(e)})});upNext()})}
function upload(blob,name,mime,u){u.up=upN>=2?"Waiting…":"Uploading…";refresh(u);
  function send(data,n){return fetch(API+"/api/intake-upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid:S.sid,ref:ref,name:name,mime:mime||"application/octet-stream",data:data})})
    .then(function(r){return r.json().catch(function(){return {error:"http_"+r.status}})})
    .then(function(d){if(d.ok)return d;var e=new Error(d.error||"x");if(n<2&&d.error!=="too_big"&&d.error!=="bad_data"){return new Promise(function(ok){setTimeout(ok,2000*(n+1))}).then(function(){return send(data,n+1)})}throw e},
      function(e){if(n<2)return new Promise(function(ok){setTimeout(ok,2000*(n+1))}).then(function(){return send(data,n+1)});throw e})}
  return slot(function(){u.up="Uploading…";refresh(u);return b64(blob).then(function(data){return send(data,0)})})
  .then(function(d){u.up="";u.url=d.url;if(d.folder)S.media=d.folder;refresh(u);return d})
  .catch(function(e){var m=e&&e.message==="too_big"?"!File 20MB se bari hai. Choti file bhejein ya WhatsApp kar dein.":e&&e.message==="too_many"?"!Bohat saari files ek saath. 2 minute baad dobara bhejein.":"!Upload nahi hua (internet). Dobara bhejein ya WhatsApp kar dein.";u.up=m;refresh(u);return null})}
function shrink(file){return new Promise(function(ok){var img=new Image();img.onload=function(){var s=Math.min(1,1024/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8).split(",")[1])};img.onerror=function(){ok(null)};img.src=URL.createObjectURL(file)})}
function sendFile(f){if(f.size>MAX){toast("File 23MB se bari hai. Isay WhatsApp par bhej dein.");return}
  var mime=f.type||"application/octet-stream",kind=/^image\//.test(mime)?"image":/^video\//.test(mime)?"video":"file";
  var cap=T.value.trim();if(cap){T.value="";sync()}
  var u=add({side:"out",type:kind,name:f.name,text:cap,local:kind!=="file"?URL.createObjectURL(f):""});
  var label=kind==="image"?"Photo":kind==="video"?"Video":"File";
  var p=kind==="image"&&/jpeg|png|webp|gif/.test(mime)?shrink(f):Promise.resolve(null);
  Promise.all([upload(f,f.name,mime,u),p]).then(function(res){var ok=res[0];
    pushUser("["+label+": "+f.name+(ok?" — saved for the team":" — upload failed")+"]"+(cap?" "+cap:""),res[1])})}
function sendLoc(){if(!navigator.geolocation){toast("Location support nahi hai.");return}toast("Location le rahe hain…");
  navigator.geolocation.getCurrentPosition(function(p){var la=p.coords.latitude.toFixed(5),lo=p.coords.longitude.toFixed(5),url="https://maps.google.com/?q="+la+","+lo;
    add({side:"out",type:"loc",url:url,text:"Current location"});pushUser("[Location: "+url+"]")},
  function(){toast("Location permission nahi mili. Area ka naam likh dein.")},{enableHighAccuracy:true,timeout:15000})}
// ---- voice notes
var rec=null,chunks=[],t0=0,tick=null,sr=null,said="";
function startRec(){if(!navigator.mediaDevices||!window.MediaRecorder){toast("Is browser mein voice note support nahi. Type kar dein.");return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var type=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"].filter(function(x){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x)})[0]||"";
    rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];said="";
    rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};rec.start();t0=Date.now();
    $("box").classList.add("hide");$("rec").classList.add("on");$("icMic").classList.add("hide");$("icSend").classList.remove("hide");
    tick=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);$("recT").textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2);if(s>=300)stopRec(true)},250);
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){try{sr=new SR();sr.lang=S.lang==="en"?"en-US":"ur-PK";sr.continuous=true;sr.interimResults=false;sr.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)said+=e.results[i][0].transcript+" "};sr.onerror=function(){};sr.start()}catch(e){sr=null}}
  }).catch(function(){toast("Mic ki permission nahi mili.")})}
function stopRec(send){if(!rec)return;var r=rec,dur=Math.max(1,Math.round((Date.now()-t0)/1000));rec=null;clearInterval(tick);
  if(sr){try{sr.stop()}catch(e){}}
  $("box").classList.remove("hide");$("rec").classList.remove("on");sync();
  r.onstop=function(){r.stream.getTracks().forEach(function(t){t.stop()});if(!send||!chunks.length)return;
    var mime=(r.mimeType||"audio/webm").split(";")[0],blob=new Blob(chunks,{type:mime}),ext=/mp4/.test(mime)?"m4a":/ogg/.test(mime)?"ogg":"webm";
    var d=Math.floor(dur/60)+":"+("0"+dur%60).slice(-2);
    var u=add({side:"out",type:"voice",dur:d,local:URL.createObjectURL(blob)});
    setTimeout(function(){var tr=said.trim();
      upload(blob,"voice-note-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+"."+ext,mime,u).then(function(ok){
        if(ok&&ok.transcript)tr=ok.transcript;
        pushUser("[Voice note "+d+(ok?", saved for the team":", upload failed")+(ok&&ok.voiceover?" (voiceover recording)":"")+(tr?'. Transcript: "'+tr+'"':". No transcript")+"]")})},sr?700:0)};
  r.stop()}
$("recX").onclick=function(){stopRec(false)};
render();sync();
if(S.msgs.length&&S.msgs[S.msgs.length-1].role==="user")queue();
})();
</script>
